<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--screen);color:var(--text);font:400 15px/19px "Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;letter-spacing:-.01em}
body{min-height:100vh;max-width:480px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--top) + env(safe-area-inset-top)) 16.8px 21.2px;background:linear-gradient(var(--screen) 70%,transparent)}
.bar h1{position:absolute;left:0;right:0;margin:0;text-align:center;font-size:18px;font-weight:500;line-height:46.4px;pointer-events:none}
.round,.pill{height:46.4px;border-radius:90px;background:var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05);display:grid;place-items:center}
.round{width:46.4px}.pill{height:44px;min-width:58.4px;padding:0 14px;font-size:15px;font-weight:500}
.round svg{width:22px;height:22px}
main{padding:0 16.8px 96px;display:flex;flex-direction:column;gap:16.8px}
.card{background:var(--card);border-radius:20px}
.verify{padding:16.8px;display:flex;gap:10px;align-items:flex-start;width:100%}
.dot{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.dot.ok{background:var(--primary);color:var(--inverse)}.dot.bad{background:var(--danger);color:#fff;font-size:12px;font-weight:600}
.dot svg{width:12px;height:12px}
.spin{width:16px;height:16px;border:2px solid var(--text3);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.verify b{display:block;font-size:15px;font-weight:500;line-height:19px}
.verify p{margin:3px 0 0;font-size:13px;line-height:16px;word-break:keep-all;color:var(--text2)}
.verify a{display:block;margin-top:6px;font-size:13px;line-height:16px;color:var(--blue);text-decoration:none}
.week{padding:16.8px}
.week header{display:flex;align-items:center;gap:8px;margin-bottom:16px;height:20px}
.week header b{font-size:16px;font-weight:500;line-height:20px}.week header span{flex:1;font-size:13px;line-height:16px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:flex;gap:12.8px}
.tile{flex:1;background:var(--flat);border-radius:16px;padding:14px}
.tile b{display:block;font-size:22px;font-weight:600;line-height:28px}.tile span{display:block;margin-top:2px;font-size:13px;line-height:16px;color:var(--text2)}
.day{margin:0;padding:0 0 0 4px;font-size:13px;line-height:20.8px;color:var(--text2)}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:14.8px;width:100%;padding:14px 14px 14px 17.6px;min-height:72px;border-top:1.2px solid var(--screen)}
.row:first-child{border-top:0}
.ico{flex:none;width:32px;height:32px;border-radius:8px;background:var(--raised);display:grid;place-items:center}
.ico svg{width:19px;height:19px}
.ico.warn{background:#FCEDEB;color:var(--danger);font-weight:600}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:16px;font-weight:400;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;margin-top:3px;font-size:13px;line-height:16px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row time{font-size:13px;color:var(--text3);white-space:nowrap}
.note{margin:0;padding:8px 4px;font-size:13px;line-height:17px;color:var(--text2)}
.empty{padding:24px 0;font-size:15px;color:var(--text2);text-align:center}
.chev{flex:none;display:grid;color:var(--text3)}.chev svg{width:18px;height:18px}
a.card{color:inherit;text-decoration:none}.verify .chev{align-self:center;margin-left:auto}
.row.nav{min-height:55px;padding-top:10px;padding-bottom:10px}.row.nav time{font-size:15px;color:var(--text2)}
.ico.bare{background:none;width:24px;height:24px}.ico.ltr{font-size:15px;font-weight:600;color:var(--text2)}
.safe{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--hair)}
.safe b{display:block;font-size:15px;font-weight:500;line-height:19px}.safe span{display:block;font-size:13px;line-height:17px;color:var(--text2)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16.8px;padding:0 16.8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:90px;background:var(--hair);font-size:15px}.chip.on{background:var(--primary);color:var(--inverse)}
.flat{margin:-6px 0}.flat .row{border:0;padding:9px 4px;min-height:58px}.flat .ico{width:40px;height:40px;border-radius:10px;background:var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.search{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));width:min(364px,calc(100% - 68px));height:56px;border-radius:90px;background:var(--hair);display:flex;align-items:center;gap:10px;padding:0 22px;box-shadow:0 4px 16px rgba(0,0,0,.08);z-index:4}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:0}.search svg{width:16px;height:16px;color:var(--text2)}
.hero{display:flex;gap:20px;align-items:center}.big{flex:none;width:84px;height:84px;border-radius:22px;background:var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.08);display:grid;place-items:center;font-size:34px;font-weight:600}
.hero b{display:block;font-size:19px;font-weight:500;line-height:25px}.hero span{font-size:15px;color:var(--text2)}
.lead{margin:0;font-size:16px;line-height:21px}.sec{margin:6px 0 -6px;font-size:15px;font-weight:500}
.kv{display:flex;align-items:center;gap:4px;min-height:70px;padding:0 12px 0 22px;border-radius:26px;background:var(--card);font-size:18px;margin-bottom:-6px}
.kv span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv button{width:40px;height:40px;display:grid;place-items:center;color:var(--text2)}.kv svg{width:20px;height:20px}
.check{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 14px;font-size:15px;border-top:1px solid var(--hair)}.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.mono{font:500 20px/28px ui-monospace,Menlo,monospace;letter-spacing:.04em;text-align:center;padding:14px;background:var(--flat);border-radius:16px}
.copybox{padding:12px 14px;background:var(--flat);border-radius:16px;font-size:13px;line-height:18px;word-break:break-all;color:var(--text2)}
.sheet .field{background:var(--flat)}.sheet .group{margin-bottom:8px}.sheet small.top{margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--primary);color:var(--inverse);padding:10px 16px;border-radius:90px;font-size:14px;z-index:20}
[hidden]{display:none!important}
/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:8px 14px calc(22px + env(safe-area-inset-bottom))}
.grab{width:24px;height:4px;border-radius:2px;background:#DADADA;margin:0 auto 22px}
.sheet h2{margin:0 0 15px 7px;font-size:18px;font-weight:500;line-height:24px}
.group{background:var(--flat);border-radius:16px;overflow:hidden}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 14px;height:46px;font-size:15px;border-top:1px solid var(--hair)}
.opt:first-child{border-top:0}.opt span{color:var(--text2)}.opt.danger{color:var(--danger)}
.sheet small{display:block;margin:16px 0 0;font-size:13px;line-height:17px;color:var(--text2)}
/* sign-in card */
.login{margin-top:8px;padding:18px 16px}
.login h2{margin:0 0 4px;font-size:18px;font-weight:500}.login p{margin:0 0 16px;font-size:13px;line-height:17px;color:var(--text2)}
.field{display:block;width:100%;height:48px;margin-bottom:8px;padding:0 14px;border:0;border-radius:14px;background:var(--flat);color:var(--text);font:inherit;font-size:16px;outline:0}
.go{width:100%;height:48px;margin-top:8px;border-radius:90px;background:var(--primary);color:var(--inverse);font-size:16px;font-weight:500;text-align:center}
.go[disabled]{opacity:.4}
.err{min-height:17px;margin:8px 2px 0;font-size:13px;color:var(--danger)}
.lock{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--text2)}.lock svg{width:15px;height:15px}
</style>

<p class="lead">${W.itemLead(see.filter((m) => !m.agent).length, see.filter((m) => m.agent).length)}</p>
<p class="sec">${W.account}</p>
${x.user ? kv('kv-user', x.user) : ''}${x.pw ? `<div class="kv"><span id="pw">••••••••••</span><button data-act="show" aria-label="${W.show}">${IC.eye}</button><button data-act="copypw" aria-label="${W.copy}">${IC.copy}</button></div>` : ''}${x.uri ? kv('kv-uri', x.uri) : ''}
<p class="sec">${W.whoSees}</p>
<div class="flat">${see.map((m) => `<div class="row"><div class="ico ltr">${m.agent ? IC.bot : initial(m.name || m.email)}</div><div class="t"><b>${esc(m.name || m.email)}</b><span>${stat(m)}</span></div></div>`).join('')}</div>
<p class="sec">${W.aiReads}</p>
${did.length ? `<div class="card list">${did.map(logRow).join('')}</div>` : `<p class="note">${W.noReads}</p>`}
<p class="sec">${W.keepSafe}</p>
<div class="card verify"><div class="dot">${IC.lock}</div><div><b>${W.safe1}</b><p>${W.safe1Why}</p></div></div>
<div class="card verify"><div class="dot">${IC.time}</div><div><b>${W.safe2}</b><p>${W.safe2Why}</p></div></div></main>`
}
// ---- sheets ----
const DAYS = [1, 7, 30, 90]
const wrap = (title, body, form) => $(`<div class="scrim" data-act="close"><${form ? `form data-form="${form}"` : 'div'} class="sheet" role="dialog" aria-label="${title}"><div class="grab"></div><h2>${title}</h2>${body}</${form ? 'form' : 'div'}></div>`)
// access period and on/off: for one member, or (no member) for every AI account at once
function accessSheet(m) {
  const who = m ? [m] : S.members.filter((x) => x.agent), id = m ? `data-id="${m.id}"` : ''
  const cur = who[0]?.accessUntil ? Math.max(1, Math.round((Date.parse(who[0].accessUntil) - Date.now()) / 864e5)) : null, on = who.some((x) => x.status === 2)
  return wrap(m ? esc(m.name || m.email) : W.sheet, `<div class="group"><button class="opt" data-act="days" ${id}><b style="font-weight:400">${W.keep}</b><span data-days="${cur ?? ''}">${cur ? W.days(cur) : W.noEnd} ›</span></button><button class="opt danger" data-act="${on ? 'off' : 'on'}" ${id}>${on ? W.turnOff : W.turnOn}</button></div>
<small>${W.sheetNote}</small>`)
}
async function memberSheet(m) {
  if (m.status === 0) return wrap(esc(m.name || m.email), `<small class="top">${m.agent ? W.inviteAgentWhy : W.inviteWhy}</small><div class="copybox" id="cp">${esc(m.agent ? `node scripts/team.mjs join ${S.org} ${m.id} ${m.inviteToken}` : `${location.origin}/team#${S.org}.${m.id}.${m.inviteToken}`)}</div><button class="go" data-act="copy" data-from="cp">${W.copy}</button>`)
  if (m.status === 1) return wrap(esc(m.name || m.email), `<small class="top">${W.fpWhy}</small><div class="mono">${await fingerprint(m.publicKey)}</div><button class="go" data-act="confirm" data-id="${m.id}">${W.fpSame}</button>`)
  return accessSheet(m)
}
const vaultPick = () => S.vaults.length > 1 ? `<select class="field" name="vault">${S.vaults.map((v) => `<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select>` : `<input type="hidden" name="vault" value="${S.vaults[0]?.id ?? ''}">`
const inviteSheet = (agent) => wrap(agent ? W.inviteAgent : W.invite, `<input class="field" name="email" type="email" autocomplete="off" placeholder="${W.email}" required><input class="field" name="name" autocomplete="off" maxlength="60" placeholder="${W.nameOpt}">${vaultPick()}
<div class="group"><label class="check">${W.readOnly}<input type="checkbox" name="ro" ${agent ? 'checked' : ''}></label>${agent ? `<label class="check">${W.keep30}<input type="checkbox" name="d30" checked></label>` : ''}</div>
<input type="hidden" name="agent" value="${agent ? 1 : ''}"><button class="go">${W.inviteGo}</button><p class="err" role="alert"></p>`, 'invite')
const addSheet = () => wrap(W.add, `<input class="field" name="name" autocomplete="off" maxlength="120" placeholder="${W.itemName}" required><input class="field" name="user" autocomplete="off" placeholder="${W.user}"><input class="field" name="pw" type="password" autocomplete="new-password" placeholder="${W.pass}"><input class="field" name="uri" inputmode="url" autocomplete="off" placeholder="${W.site}">${vaultPick()}
<button class="go">${W.addGo}</button><p class="err" role="alert"></p>`, 'add')
const open = (n) => { document.querySelector('.scrim')?.remove(); document.body.append(n) }
const toast = (t) => { const n = $(`<div class="toast" role="status">${t}</div>`); document.body.append(n); setTimeout(() => n.remove(), 1600) }

async function render() {
  const app = document.getElementById('app')
  if (!S) { app.innerHTML = `<div class="bar"><span></span><h1>${W.app}</h1><span></span></div><main><form class="card login" data-form="signin"><h2>${INV ? W.joinTitle : W.signIn}</h2><p>${INV ? W.joinWhy : W.signInWhy}</p>
<input class="field" name="email" type="email" autocomplete="username" placeholder="${W.email}" required><input class="field" name="password" type="password" autocomplete="current-password" placeholder="${W.pw}" required>
${INV ? `<label class="check" style="padding:0 2px;height:40px;border:0;font-size:13px">${W.joinNew}<input type="checkbox" name="fresh"></label>` : ''}<button class="go">${W.go}</button><p class="err" role="alert"></p><div class="lock">${IC.lock}<span>${W.stays}</span></div></form></main>`; return }
  if (S.mode) {
    const card = S.mode === 'joined' ? `<div class="card login"><h2>${S.joinFail ? W.joinTitle : W.joined}</h2><p>${S.joinFail ? W.joinFail : W.joinedWhy}</p><div class="mono">${await fingerprint(S.pub)}</div></div>`
      : S.mode === 'member' ? `<div class="card login"><h2>${W.memberTitle}</h2><p>${W.memberWhy}</p><a class="go" style="display:grid;place-items:center;text-decoration:none" href="/">${W.openVault}</a></div>`
      : `<form class="card login" data-form="create"><h2>${W.mkTitle}</h2><p>${W.mkWhy}</p><input class="field" name="name" maxlength="60" autocomplete="off" placeholder="${W.mkName}" required><button class="go">${W.mkGo}</button><p class="err" role="alert"></p></form>`
    app.innerHTML = `<div class="bar"><button class="round" data-act="out" aria-label="${W.out}">${IC.back}</button><h1>${W.app}</h1><span></span></div><main>${card}</main>`; return
  }
  if (!S.items) {
    app.innerHTML = bar(S.orgName, '', 'out') + `<main><div class="card verify"><div class="dot"><div class="spin"></div></div><div><b>${W.opening}</b></div></div></main>`
    try { await loadAll() } catch (e) { app.querySelector('.verify').innerHTML = `<div class="dot bad">!</div><div><b>${W.loadFail}</b><p>${W.loadFailWhy} (${esc(e.message)})</p></div>`; return }
  }
  const x = V.name === 'item' && S.items.find((i) => i.id === V.arg)
  app.innerHTML = V.name === 'log' ? logScreen(S.log) : V.name === 'people' ? peopleScreen(false) : V.name === 'agents' ? peopleScreen(true) : V.name === 'logins' ? loginsScreen() : x ? itemScreen(x) : hub()
}
const reload = async () => { await loadAll(); await render() }
document.addEventListener('submit', async (ev) => {
  ev.preventDefault(); const f = ev.target, kind = f.dataset.form, btn = f.querySelector('.go'), err = f.querySelector('.err')
  btn.disabled = true; err.textContent = ''
  try {
    if (kind === 'signin') { await signIn(f.email.value, f.password.value, f.fresh?.checked); return render() }
    if (kind === 'create') { await createVault(f.name.value.trim()); return render() }
    if (kind === 'invite') {
      const r = await api('POST', `/api/organizations/${S.org}/users/invite`, { emails: [f.email.value.trim().toLowerCase()], type: 2, displayName: f.name.value.trim() || undefined, agent: !!f.agent.value, ...(f.d30?.checked ? { accessDays: 30 } : {}), collections: [{ id: f.vault.value, readOnly: f.ro.checked }] })
      V = { name: f.agent.value ? 'agents' : 'people' }; await reload(); return open(await memberSheet(S.members.find((m) => m.id === r.data[0].id)))
    }
    if (kind === 'add') { // encrypted here with the team key; the server stores ciphertext
      const e = (v) => v ? encS(S.orgKey, v) : null, uri = f.uri.value.trim()
      await api('POST', '/api/ciphers/create', { cipher: { type: 1, organizationId: S.org, name: await e(f.name.value.trim()), notes: null, favorite: false, reprompt: 0, login: { username: await e(f.user.value), password: await e(f.pw.value), totp: null, uris: uri ? [{ uri: await e(uri), match: null }] : [] } }, collectionIds: [f.vault.value] })
      document.querySelector('.scrim')?.remove(); return reload()
    }
  } catch (e) {
    if (kind === 'signin') S = null
    err.textContent = kind === 'create' ? `${W.mkFail} (${esc(e.message)})` : e.message === 'short' ? W.joinShort : kind === 'invite' ? `${W.inviteFail} (${esc(e.message)})` : kind === 'add' ? `${W.addFail} (${esc(e.message)})` : e.message === 'kdf' ? W.kdf : W.bad
    btn.disabled = false
  }
})
document.addEventListener('input', (ev) => { // search filters the rows already on screen
  if (!ev.target.closest('.search')) return
  const q = ev.target.value.trim().toLowerCase()
  for (const r of document.querySelectorAll('[data-q]')) r.hidden = !r.dataset.q.includes(q)
})
document.addEventListener('click', async (ev) => {
  const g = ev.target.closest('[data-go]')
  if (g) { V = { name: g.dataset.go, arg: g.dataset.arg }; scrollTo(0, 0); return render() }
  const el = ev.target.closest('[data-act]'); if (!el) return
  const act = el.dataset.act, id = el.dataset.id, users = `/api/organizations/${S?.org}/users`
  if (act === 'close') { if (ev.target === el) el.remove(); return }
  if (act === 'out') { S = null; V = { name: 'hub' }; return render() }
  if (act === 'settings') return open(accessSheet())
  if (act === 'member') { await reload(); return open(await memberSheet(S.members.find((m) => m.id === id))) } // reload: the member may have joined since the list was drawn
  if (act === 'invite') return open(inviteSheet(!!el.dataset.agent))
  if (act === 'add') return open(addSheet())
  if (act === 'copy') { await navigator.clipboard.writeText(document.getElementById(el.dataset.from).textContent); return toast(W.copied) }
  if (act === 'show' || act === 'copypw') {
    const x = S.items.find((i) => i.id === V.arg), pw = await text(x.key, x.pw), at = document.getElementById('pw')
    if (act === 'copypw') { await navigator.clipboard.writeText(pw); return toast(W.copied) }
    at.textContent = at.dataset.on ? '••••••••••' : pw; at.dataset.on = at.dataset.on ? '' : '1'; return
  }
  const who = id ? S.members.filter((m) => m.id === id) : S.members.filter((m) => m.agent)
  el.disabled = true
  if (act === 'days') { const next = DAYS[(DAYS.indexOf(Number(el.querySelector('span').dataset.days)) + 1) % DAYS.length]
    for (const m of who) await api('PUT', `${users}/${m.id}/azet/access`, { accessDays: next }) }
  if (act === 'off' || act === 'on') for (const m of who) await api('PUT', `${users}/${m.id}/${act === 'off' ? 'revoke' : 'restore'}`)
  if (act === 'confirm') await api('POST', `${users}/${id}/confirm`, { key: await rsaEnc(who[0].publicKey, S.orgKey) })
  document.querySelector('.scrim')?.remove(); await reload()
  if (act === 'days') open(accessSheet(id ? S.members.find((m) => m.id === id) : undefined))
})
if (new URLSearchParams(location.search).has('frame')) document.documentElement.style.setProperty('--top', '44px') // room for a phone status bar, for comparing with the reference captures
render()
</script>
</body>
</html>
